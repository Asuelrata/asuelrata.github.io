<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8" />
    <title>Eclipsador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script charset="utf-8" src="js/eclipsador.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/eclipsador.css">
</head>
<body>
    <a href="/">&#8592; Volver al inicio</a>
    <div id="main">
        <h2>1. ¿Quién juega?</h2>

            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="marco4" value="marco4" /><label for="marco4">4. Marco</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="joseba5" value="joseba5" /><label for="joseba5">5. Joseba</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="sergio6" value="sergio6" /><label for="sergio6">6. Sergio</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="adri7" value="adri7" /><label for="adri7">7. Adrian</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="pascu8" value="pascu8" /><label for="pascu8">8. Pascual</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="jorge9" value="jorge9" /><label for="jorge9">9. Jorge P.</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="alvaro10" value="alvaro10" /><label for="alvaro10">10. Alvaro</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="amado13" value="amado13" /><label for="amado13">13. Amado</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="asu15" value="asu15" /><label for="asu15">15. Asu</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="izan16" value="izan16" /><label for="izan16">16. Izan</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="luis21" value="luis21" /><label for="luis21">21. Luis</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="jorge23" value="jorge23" /><label for="jorge23">23. Jorge SM.</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="eneko80" value="eneko80" /><label for="eneko80">80. Eneko</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="diegoXX" value="diegoXX" /><label for="diegoXX">?. Diego</label></div>
            <div class="entrada"><input type="checkbox" class="jugadores" name="jugadores" id="anderXX" value="anderXX" /><label for="anderXX">?. Ander</label></div>
        </div>

        <h2>2. Formato</h2>
        <div class="selector">
            <div class="entrada"><input type="radio" name="equipacion" id="primeraopt" value="primera" checked="checked" /><label for="primeraopt">Local</label></div>
            <div class="entrada"><input type="radio" name="equipacion" id="segundaopt" value="segunda" /><label for="segundaopt">Visitante</label></div>
        </div>

        <h2>3. Resultado</h2>
        <img class="ocultarimg" id="primera" src="imgs/equipacion-principal.png">
        <button onclick="generarcanvas()">Generar</button>
        <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>
</body>
</html>
